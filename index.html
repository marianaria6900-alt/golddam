<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>گلددام | خرید و فروش طلا و جواهر</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<style>
*{font-family:'Vazirmatn',tahoma;margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff}
.gold-text{background:linear-gradient(135deg,#FFD700,#FFA500);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:bold}
.gold-bg{background:linear-gradient(135deg,#FFD700,#FFA500)}
header{padding:20px;text-align:center;border-bottom:1px solid #222}
.hero{padding:80px 20px;text-align:center;background:radial-gradient(circle at center,rgba(255,215,0,0.15),transparent 70%)}
.hero h1{font-size:48px;margin-bottom:15px}
.hero p{color:#aaa;font-size:18px;margin-bottom:30px}
.btn{padding:14px 35px;border-radius:30px;text-decoration:none;color:#000;display:inline-block;font-weight:bold}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;padding:40px 20px;max-width:1100px;margin:auto}
.card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,215,0,0.2);border-radius:16px;padding:30px;text-align:center}
.card h3{margin:15px 0 10px;color:#FFD700}
footer{text-align:center;padding:40px;color:#666;border-top:1px solid #222;margin-top:40px}
</style>
</head>
<body>
<header><h2 class="gold-text">GOLDDAM</h2></header>

<section class="hero">
<h1>طلای تو، <span class="gold-text">سرمایه تو</span></h1>
<p>خرید و فروش آنلاین طلا و جواهر با بهترین قیمت بازار</p>
<a class="btn gold-bg" href="#">مشاهده محصولات</a>
</section>

<div class="cards">
<div class="card"><div style="font-size:40px">💍</div><h3>انگشتر طلا</h3><p style="color:#888">کلکسیون جدید 1404</p></div>
<div class="card"><div style="font-size:40px">📿</div><h3>گردنبند</h3><p style="color:#888">طرح های خاص و لاکچری</p></div>
<div class="card"><div style="font-size:40px">⌚</div><h3>ساعت طلا</h3><p style="color:#888">برندهای معتبر جهانی</p></div>
</div>

<footer>golddam.ir | تمام حقوق محفوظ است</footer>
</body>
</html>
