<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>گلددم</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:sans-serif;scroll-behavior:smooth}.gold{background:linear-gradient(135deg,#FFD700,#FFA500)}</style></head><body class="bg-[#f6f5f0]"><header class="h-[72px] flex justify-between items-center max-w-[1280px] mx-auto px-6 border-b sticky top-0 bg-[#f6f5f0]/80 backdrop-blur z-50"><div class="font-black text-[20px]">گلددم ✦</div><div class="flex gap-2"><button onclick="location.href='#pricing'" class="px-4 py-2 font-bold text-[13px]">تعرفه</button><button onclick="location.href='#pricing'" class="px-5 py-2.5 rounded-full bg-black text-white text-[13px] font-bold">شروع رایگان</button></div></header><section class="max-w-[1280px] mx-auto px-6 py-20 grid md:grid-cols-2 gap-10"><div><h1 class="text-[38px] font-black leading-[1.1]">دایرکت اینستاگرام را<br>به طلا تبدیل کنید</h1><p class="mt-4 text-black/60">کامنت به دایرکت، دایرکت به فروش - با هوش مصنوعی.</p><div class="mt-6 flex gap-3"><button onclick="document.getElementById('pricing').scrollIntoView({behavior:'smooth'})" class="px-6 h-[52px] rounded-full gold font-black">شروع رایگان</button><button onclick="alert('دمو به زودی')" class="px-6 h-[52px] rounded-full bg-white border font-bold">دمو</button></div></div><div class="bg-white rounded-[32px] p-4 shadow-xl max-w-[320px] border mx-auto"><div class="text-[12px] font-bold">فعال • پاسخ خودکار روشن</div><div class="mt-4 space-y-2 text-[13px]"><div class="bg-black/5 p-3 rounded-2xl max-w-[80%]">قیمت این ست چنده؟</div><div class="bg-[#FFD700]/20 p-3 rounded-2xl max-w-[80%] mr-auto">۸۹۰ تومن!</div><div class="bg-black text-white p-3 rounded-2xl">فرم سفارش ⚡️<button onclick="location.href='#pricing'" class="w-full bg-white text-black rounded-full py-2 mt-2 font-bold">ثبت سفارش ✓</button></div></div></div></section><section id="pricing" class="bg-black text-white rounded-[32px] max-w-[1280px] mx-auto p-8 mt-10"><h2 class="text-[26px] font-black text-center">تعرفه‌ها</h2><div class="grid md:grid-cols-3 gap-4 mt-8 max-w-[800px] mx-auto"><div class="bg-white/10 p-5 rounded-[24px]"><h3>پایه</h3><div class="text-[28px] font-black">۲۹۹</div><button onclick="alert('پایه انتخاب شد')" class="w-full mt-4 h-11 rounded-full bg-white text-black font-bold">خرید</button></div><div class="bg-[#1a1a1a] border border-[#FFD700]/40 p-5 rounded-[24px]"><span class="bg-[#FFD700] text-black text-[10px] px-2 py-1 rounded-full">محبوب</span><h3 class="mt-2">طلایی</h3><div class="text-[28px] font-black">۵۹۹</div><button onclick="alert('طلایی انتخاب شد')" class="w-full mt-4 h-11 rounded-full gold text-black font-bold">خرید</button></div><div class="bg-white/10 p-5 rounded-[24px]"><h3>الماسی</h3><div class="text-[28px] font-black">۹۹۹</div><button onclick="alert('الماسی انتخاب شد')" class="w-full mt-4 h-11 rounded-full bg-white text-black font-bold">خرید</button></div></div></section></body></html>
