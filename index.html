<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>گلدم - قیمت طلا و سکه</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:tahoma;padding-bottom:40px}
header{background:#111;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #d4af37}
.logo{color:#d4af37;font-weight:900;font-size:20px}
.live{background:#d4af37;color:#000;padding:4px 12px;border-radius:20px;font-weight:900;font-size:12px}
.hero{text-align:center;padding:28px 16px}
.hero h1{color:#d4af37;font-size:24px;margin-bottom:8px}
.hero p{color:#aaa}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px}
.card{background:#151515;border:1px solid #222;border-radius:14px;padding:14px}
.card span{color:#888;font-size:12px}
.card b{display:block;font-size:18px;margin-top:6px}
.gold{grid-column:1/-1;background:linear-gradient(135deg,#1a1a0a,#2a2200);border-color:#d4af37;text-align:center}
.gold b{font-size:26px;color:#d4af37}
.btn{display:block;margin:16px;background:linear-gradient(90deg,#d4af37,#f9e27a);color:#000;text-align:center;padding:14px;border-radius:12px;font-weight:900;text-decoration:none}
</style>
</head>
<body>
<header><div class="logo">GOLDDAM.IR</div><div class="live">● زنده</div></header>
<div class="hero"><h1>قیمت لحظه‌ای طلا و سکه</h1><p>بروزرسانی خودکار - گلدم</p></div>
<div class="grid">
<div class="card gold"><span>انس جهانی طلا</span><b>$ 2,045.30</b></div>
<div class="card"><span>طلای 18 عیار</span><b>3,245,000 ت</b></div>
<div class="card"><span>سکه امامی</span><b>38,500,000 ت</b></div>
<div class="card"><span>نیم سکه</span><b>22,100,000 ت</b></div>
<div class="card"><span>ربع سکه</span><b>14,200,000 ت</b></div>
</div>
<a class="btn" href="https://t.me/">ورود به کانال تلگرام</a>
</body>
</html>
